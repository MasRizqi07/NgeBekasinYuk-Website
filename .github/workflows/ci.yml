name: NgeBekasinYuk Production Verification CI

on:
  push:
    branches: [main, master, "antigravity/*", "feat/*", "fix/*", "chore/*"]
  pull_request:
    branches: [main, master]

jobs:
  verify:
    name: Complete Hardening Verification Gates (PostgreSQL 16)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: ngebekasinyuk_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/ngebekasinyuk_ci?schema=public"
      AUTH_SECRET: "ci-auth-secret-min-32-characters-test-key-prod"
      ADMIN_STEP_UP_SECRET: "ci-admin-step-up-secret-min-32-chars-test"
      TOTP_ENCRYPTION_KEY: "ci-totp-encryption-key-32-characters-long!"
      APP_ENV: "test"
      ALLOW_DEMO_IN_PRODUCTION: "true"
      DEMO_PAYMENT_PROVIDER: "true"
      DEMO_KYC_PROVIDER: "true"
      DEMO_WITHDRAWAL_PROVIDER: "true"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      CI: "true"
      STORE_PATH: ""

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Exact Git HEAD SHA
        shell: bash
        run: |
          echo "Checked out SHA: $(git rev-parse HEAD)"
          echo "GitHub Event: ${{ github.event_name }}"
          echo "GitHub Ref: ${{ github.ref }}"
          echo "GitHub SHA: ${{ github.sha }}"

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.0.0
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Gate 1 - Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Gate 2 - Prisma Validate & Generate Client
        run: |
          pnpm --filter web exec prisma validate
          pnpm --filter web run prisma:generate

      - name: Gate 3 - Deploy Fresh PostgreSQL Migrations
        run: |
          pnpm --filter web exec prisma migrate deploy
          pnpm --filter web exec prisma migrate status

      - name: Gate 4 - Seed Test Database Fixtures
        run: pnpm --filter web run db:seed

      - name: Gate 5 - Code Quality & Strict Linting (0 Warnings)
        run: pnpm run lint

      - name: Gate 6 - Strict TypeScript Typecheck
        run: pnpm --filter web run typecheck

      - name: Gate 7 - Unit, Integration & Concurrency Test Suite
        run: pnpm --filter web run test

      - name: Gate 8 - Production App Router Bundle Build
        run: pnpm --filter web run build

      - name: Install Playwright Chromium with OS Dependencies
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Gate 9 - Playwright Browser E2E Test Suite
        run: pnpm --filter web run test:e2e
